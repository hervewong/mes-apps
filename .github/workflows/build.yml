name: Construire les applications

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  site:
    name: Site web (applications installables avec Chrome)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

  windows:
    name: Programme Windows (.exe) - Radio Monde
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build.mjs
      - run: npm install
      - run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Publier les fichiers .exe dans Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view windows >/dev/null 2>&1 || gh release create windows --title "Radio Monde pour Windows" --notes "Telechargez Radio-Monde-Installateur.exe (installation) ou Radio-Monde-Portable.exe (sans installation)."
          gh release upload windows release/Radio-Monde-Installateur.exe release/Radio-Monde-Portable.exe --clobber
